<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacy Policy — Appace</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background-color: #000000;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h1, h2, h3 {
      color: #ffffff;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
    }
    h1 {
      margin-top: 0;
      font-size: 2em;
    }
    p {
      margin-bottom: 1em;
    }
    ul {
      margin-bottom: 1em;
      padding-left: 24px;
    }
    li {
      margin-bottom: 0.5em;
    }
    code {
      background-color: #1a1a1a;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
    a {
      color: #4da3ff;
    }
  </style>
</head>
<body>
  <div id="content">Loading Privacy Policy...</div>

  <script>
    fetch('./privacy_policy.md')
      .then(function(res) {
        if (!res.ok) throw new Error('Failed to load markdown');
        return res.text();
      })
      .then(function(md) {
        document.getElementById('content').innerHTML = marked.parse(md);
      })
      .catch(function(err) {
        document.getElementById('content').innerText = 'Error loading privacy policy.';
        console.error(err);
      });
  </script>
</body>
</html>
